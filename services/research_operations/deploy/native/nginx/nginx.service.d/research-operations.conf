[Unit]
Requires=research-operations-migrate.service
After=research-operations-migrate.service

[Service]
# The root master starts with the proxy's private primary group. The reviewed
# nginx.conf drops workers to research-proxy, whose two exact persistent socket
# memberships survive Nginx's initgroups(3) call. Never add research-ops here.
Group=research-proxy
LoadCredential=ops.htpasswd:/etc/research-ops/secrets/ops.htpasswd
RuntimeDirectory=research-operations-nginx-credentials research-operations-nginx-temp research-operations-nginx-static
RuntimeDirectoryMode=0750
BindReadOnlyPaths=/srv/research/artifacts/_internal_web/static:/run/research-operations-nginx-static
ExecStartPre=
ExecStartPre=/usr/bin/install -d -o research-proxy -g research-proxy -m 0700 /run/research-operations-nginx-temp/client-body /run/research-operations-nginx-temp/proxy
ExecStartPre=/usr/bin/install -o root -g research-proxy -m 0640 %d/ops.htpasswd /run/research-operations-nginx-credentials/ops.htpasswd
ExecStartPre=/usr/sbin/nginx -t -q -c /etc/nginx/nginx.conf
