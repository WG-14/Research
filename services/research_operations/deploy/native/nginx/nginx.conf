# Reviewed main configuration for the dedicated native Research reverse proxy.
# The native profile owns this Nginx instance; do not include unrelated sites.
user research-proxy research-proxy;
worker_processes auto;
pid /run/nginx.pid;
error_log syslog:server=unix:/dev/log,tag=research-nginx-main warn;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 15s;
    types_hash_max_size 2048;

    client_body_temp_path /run/research-operations-nginx-temp/client-body 1 2;
    proxy_temp_path /run/research-operations-nginx-temp/proxy 1 2;

    include /etc/nginx/conf.d/research-operations.conf;
}
