# Dedicated, non-login operating-system principals for the native trust tiers.
# Install under /etc/sysusers.d/ and run systemd-sysusers before preflight.
g research-ops -
g research-backup -
g research-web-proxy -
g research-ops-proxy -

u research-migrate - "Research schema migration" /nonexistent /usr/sbin/nologin
u research-web - "Research employee web" /nonexistent /usr/sbin/nologin
u research-outbox - "Research audit outbox" /nonexistent /usr/sbin/nologin
u research-job - "Research admitted job worker" /nonexistent /usr/sbin/nologin
u research-alert - "Research service alerting" /nonexistent /usr/sbin/nologin
u research-validator - "Research audit validator" /nonexistent /usr/sbin/nologin
u research-backup - "Research backup writer" /nonexistent /usr/sbin/nologin
u research-diagnostics - "Research diagnostics API" /nonexistent /usr/sbin/nologin
u research-retention - "Research retention auditor" /nonexistent /usr/sbin/nologin
u research-proxy - "Research dedicated reverse proxy" /nonexistent /usr/sbin/nologin

# Nginx calls initgroups(3) while dropping from its root master to the worker
# identity. These two exact persistent memberships are therefore the authority
# for socket access; preflight rejects every additional controlled-group member.
m research-proxy research-web-proxy
m research-proxy research-ops-proxy
